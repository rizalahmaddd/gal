plugins {
    id "com.android.library"
    id "kotlin-android"
    // HAPUS: id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "studio.midoridesign.gal"   // bebas tapi unik
    compileSdk 34                         // angka eksplisit

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
}

repositories {
    google()
    mavenCentral()
}

// HAPUS blok 'flutter { source "../.." }' kalau masih ada
